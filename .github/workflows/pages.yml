# 검증판 게임을 GitHub Pages 에 올린다 — site/index.html (python3 web/build.py 가 만든다, tools/check.sh 에 들어 있다)
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source: "GitHub Actions"
# 주소: https://myheecheol.github.io/Tennis/
name: 검증판 배포 (GitHub Pages)

on:
  push:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 기본 브랜치에 올라온 것만 배포한다 (다른 브랜치의 push 는 건너뜀)
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
